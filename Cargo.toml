[workspace]
resolver = "3"
members = [
    "crates/edit",
    "crates/edit-cli",
    "crates/notia-image-editor-plugin",
]
default-members = ["crates/edit", "crates/edit-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Chakyiu/notia-image-editor"
authors = ["Chakyiu"]

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
clap = { version = "4", features = ["derive"] }
